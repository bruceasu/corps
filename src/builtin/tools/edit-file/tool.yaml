name: edit-file
description: Replace old_text with new_text in a file (first occurrence).
autoExecuteAllowed: true
tool:
  type: external-command
  program: python
  args:
    - "${toolHome}/run.py"
    - "--path"
    - "${path}"
    - "--old-text"
    - "${old_text}"
    - "--new-text"
    - "${new_text}"
arguments:
  - name: path
    type: string
    description: File path
    required: true
  - name: old_text
    type: string
    description: Text to find
    required: true
  - name: new_text
    type: string
    description: Replacement text
    required: true
